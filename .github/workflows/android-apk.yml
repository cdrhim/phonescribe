name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths:
      - "android-recorder/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Test and build installable APK
        run: gradle -p android-recorder --no-daemon testDebugUnitTest assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android-recorder/app/build/outputs/apk/debug/app-debug.apk dist/PhoneScribe-Android.apk
          sha256sum dist/PhoneScribe-Android.apk > dist/PhoneScribe-Android.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: PhoneScribe-Android
          path: |
            dist/PhoneScribe-Android.apk
            dist/PhoneScribe-Android.apk.sha256
          if-no-files-found: error

      - name: Publish tagged APK
        if: startsWith(github.ref, 'refs/tags/android-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/PhoneScribe-Android.apk
          dist/PhoneScribe-Android.apk.sha256
          --verify-tag
          --generate-notes
          --title "PhoneScribe Android ${GITHUB_REF_NAME#android-v}"
