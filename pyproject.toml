[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-meetscribe"
version = "0.1.0"
description = "Local-first Korean/English meeting transcription with speaker labels, review UI, and exports."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "LocalMeetScribe contributors" }]
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.7.0",
  "python-multipart>=0.0.9",
  "typer>=0.12.3",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
qwen = [
  "qwen-asr>=0.1.0",
  "accelerate>=0.33.0",
  "huggingface-hub>=0.24.0",
  "torch>=2.3.0",
  "transformers>=4.52.0",
]
whisper = [
  "ctranslate2>=4.4.0",
  "faster-whisper>=1.0.0",
  "whisperx>=3.3.0",
]
diarization = [
  "huggingface-hub>=0.24.0",
  "pyannote.audio>=3.3.0",
  "pyannote.metrics>=3.2.0",
]
enhance = [
  "deepfilternet>=0.5.0",
]
llm = [
  "httpx>=0.27.0",
]
dev = [
  "httpx>=0.27.0",
  "jiwer>=3.0.4",
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "ruff>=0.5.0",
]

[project.scripts]
local-meetscribe = "local_meetscribe.cli:app"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["local_meetscribe"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
